<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Send Money - Bank of Vellorian</title>
    <link rel="stylesheet" href="css/global.css" />
    <link rel="stylesheet" href="css/index.css" />
    <link rel="stylesheet" href="css/sendMoney.css" />
    <style>
      /* Inline CSS for Spinner and Timer */
      .spinner {
        display: inline-block;
        width: 20px;
        height: 20px;
        border: 3px solid rgba(255, 255, 255, 0.3);
        border-radius: 50%;
        border-top-color: #fff;
        animation: spin 0.8s linear infinite;
        vertical-align: middle;
        margin-right: 8px;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
      .cooldown-banner {
        background-color: #fff3cd;
        color: #856404;
        border: 1px solid #ffeeba;
        padding: 12px;
        border-radius: 6px;
        margin-top: 15px;
        font-weight: bold;
        text-align: center;
      }
    </style>
  </head>
  <body>
    <!-- Navbar -->
    <div class="navbar">
      <div class="left">
        <a href="account.html"
          ><img src="images/bankLogo.jpg" alt="Bank Logo"
        /></a>
        <h1><a href="account.html">BANK OF VELLORIAN</a></h1>
      </div>
      <div class="right">
        <button id="nav-logout">Logout</button>
      </div>
    </div>
    <div class="sub-navbar">
      <a href="account.html">ACCOUNT</a>
      <a href="applyLoan.html">LOANS</a>
      <a href="sendMoney.html">MONEY-TRANSFER</a>
      <a href="fileComplaint.html">COMPLAINTS</a>
      <div class="dropdown">
        <button class="dropbtn">▼</button>
        <div class="dropdown-content">
          <a href="#">PENSIONS</a>
          <a href="#">OFFERS</a>
          <a href="#">SUPPORT</a>
          <a href="#">ATM</a>
          <a href="#">NRI</a>
          <a href="#">EMI</a>
        </div>
      </div>
    </div>

    <!-- Main Content: Send Money Form -->
    <div class="main-content">
      <div class="send-money-form">
        <h2>Send Money</h2>
        <form id="sendMoneyForm" action="#" method="post">
          <label for="recipient">Recipient Username:</label>
          <input type="text" id="recipient" name="recipient" required />

          <label for="amount">Amount (INR):</label>
          <input type="number" id="amount" name="amount" step="0.01" required />

          <label for="category">Category:</label>
          <select id="category" name="category" required>
            <option value="Transfer" selected>Transfer</option>
            <option value="Education">Education</option>
            <option value="Groceries">Groceries</option>
            <option value="Rent">Rent</option>
            <option value="Salary">Salary</option>
            <option value="Shopping">Shopping</option>
            <option value="Utilities">Utilities</option>
          </select>

          <button type="submit" id="sendBtn">
            <span id="btnText">Send</span>
          </button>
        </form>

        <div
          id="cooldownTimer"
          class="cooldown-banner"
          style="display: none"
        ></div>
        <div id="sendMoneyError"></div>
        <div id="sendMoneySuccess"></div>
      </div>
    </div>

    <script src="js/script.js"></script>
    <script>
      let countdownInterval = null;

      // Logout functionality
      document
        .getElementById("nav-logout")
        .addEventListener("click", async () => {
          try {
            const response = await fetch("/auth/logout", { method: "POST" });
            if (response.ok) {
              window.location.href = "index.html";
            } else {
              console.error("Logout failed:", response.statusText);
            }
          } catch (error) {
            console.error("Error during logout:", error);
          }
        });

      // Helper: Start Timer Display
      function startCooldownTimer(secondsRemaining) {
        const timerBanner = document.getElementById("cooldownTimer");
        timerBanner.style.display = "block";

        if (countdownInterval) clearInterval(countdownInterval);

        function updateDisplay() {
          if (secondsRemaining <= 0) {
            clearInterval(countdownInterval);
            timerBanner.style.display = "none";
            return;
          }

          const minutes = Math.floor(secondsRemaining / 60);
          const seconds = secondsRemaining % 60;
          const formattedSec = seconds < 10 ? "0" + seconds : seconds;

          timerBanner.innerText = `⚠️ Account Activity Flagged! Velocity Risk Cooldown Active. Time Remaining: ${minutes}:${formattedSec}`;
          secondsRemaining--;
        }

        updateDisplay();
        countdownInterval = setInterval(updateDisplay, 1000);
      }

      // Dynamic Cooldown Checker on Page Load / Return
      async function checkExistingCooldown() {
        try {
          const response = await fetch("/customer/transactions");
          if (response.ok) {
            const transactions = await response.json();

            // Find the latest pending review transaction
            const lastFlagged = transactions.find(
              (t) => t.status === "PENDING_REVIEW" || t.type === "Pending",
            );

            if (lastFlagged && lastFlagged.dateTime) {
              // Robust string parsing for "DD/MM/YYYY, HH:MM:SS" or "DD/MM/YYYY HH:MM:SS"
              const [dateStr, timeStr] = lastFlagged.dateTime.split(" ");
              const [day, month, year] = dateStr.split("/");

              // Parse time string handling am/pm if present
              let cleanTime = timeStr;
              let isPm = lastFlagged.dateTime.toLowerCase().includes("pm");
              let isAm = lastFlagged.dateTime.toLowerCase().includes("am");
              let [hours, minutes, seconds] = cleanTime
                .replace(/am|pm/gi, "")
                .trim()
                .split(":");

              hours = parseInt(hours, 10);
              if (isPm && hours < 12) hours += 12;
              if (isAm && hours === 12) hours = 0;

              const txnTime = new Date(
                year,
                month - 1,
                day,
                hours,
                minutes || 0,
                seconds || 0,
              );
              const now = new Date();
              const elapsedSeconds = Math.floor((now - txnTime) / 1000);
              const totalCooldownSeconds = 10 * 60; // 10 minutes (600s)

              if (
                elapsedSeconds >= 0 &&
                elapsedSeconds < totalCooldownSeconds
              ) {
                const remaining = totalCooldownSeconds - elapsedSeconds;
                startCooldownTimer(remaining);
              }
            }
          }
        } catch (err) {
          console.error("Error checking cooldown:", err);
        }
      }

      // Run Cooldown Check immediately on load
      checkExistingCooldown();

      // Handle the send money form submission
      document
        .getElementById("sendMoneyForm")
        .addEventListener("submit", async function (e) {
          e.preventDefault();

          const sendBtn = document.getElementById("sendBtn");
          const btnText = document.getElementById("btnText");
          const errDiv = document.getElementById("sendMoneyError");
          const succDiv = document.getElementById("sendMoneySuccess");

          // Clear previous messages and show Spinner
          errDiv.innerText = "";
          succDiv.innerText = "";
          sendBtn.disabled = true;
          btnText.innerHTML =
            '<span class="spinner"></span> Processing Transaction...';

          const formData = new FormData(this);
          const data = {
            recipient: formData.get("recipient"),
            amount: parseFloat(formData.get("amount")),
            category: formData.get("category"),
          };

          try {
            const response = await fetch("/customer/sendMoney", {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify(data),
            });

            if (response.ok) {
              const result = await response.text();
              if (result === "success") {
                succDiv.innerText = "Money sent successfully!";
              } else {
                errDiv.innerText = result;
                // Trigger 10-minute cooldown timer visually when flagged
                if (result.includes("flagged")) {
                  startCooldownTimer(10 * 60);
                }
              }
            } else {
              const errorText = await response.text();
              errDiv.innerText = errorText;
            }
          } catch (error) {
            console.error("Error sending money:", error);
            errDiv.innerText =
              "Server error or risk service offline. Please try again later.";
          } finally {
            // Restore button state
            sendBtn.disabled = false;
            btnText.innerText = "Send";
          }
        });
    </script>
  </body>
</html>
