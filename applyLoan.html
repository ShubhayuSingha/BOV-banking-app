<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Apply for Loan - Bank of Vellorian</title>
  <link rel="stylesheet" href="css/global.css" />
  <link rel="stylesheet" href="css/applyLoan.css" />
</head>
<body>
  <!-- Navbar -->
  <div class="navbar">
    <div class="left">
      <a href="account.html"><img src="images/bankLogo.jpg" alt="Bank Logo" /></a>
      <h1><a href="account.html">BANK OF VELLORIAN</a></h1>
    </div>
    <div class="right">
      <button id="loanLogout">Logout</button>
    </div>
  </div>
  
  <!-- Sub-navbar -->
  <div class="sub-navbar">
    <a href="account.html">ACCOUNT</a>
    <a href="applyLoan.html">APPLY LOAN</a>
  </div>
  
  <!-- Main Content: Loan Application Form -->
  <div class="main-content">
    <div class="loan-application-form">
      <h2>Apply for Loan</h2>
      <form id="loanForm" action="#" method="post">
        <label for="loanType">Loan Type:</label>
        <select id="loanType" name="loan_type" required>
          <option value="">Select Loan Type</option>
          <option value="Home Loan">Home Loan</option>
          <option value="Education Loan">Education Loan</option>
          <option value="Vehicle Loan">Vehicle Loan</option>
          <option value="Personal Loan">Personal Loan</option>
          <option value="Emergency Loan">Emergency Loan</option>
        </select>
        
        <label for="loanAmount">Loan Amount (INR):</label>
        <input type="number" id="loanAmount" name="amount" step="0.01" required />
        
        <label for="loanMessage">Message:</label>
        <textarea id="loanMessage" name="message" rows="4" placeholder="Enter details for the loan" required></textarea>
        
        <button type="submit">Apply</button>
      </form>
      <div id="loanFormMessage" class="form-message"></div>
    </div>
    
    <!-- Past Loans Section -->
    <div class="past-loans">
      <h2>Past Loan Applications</h2>
      <div id="loansContainer">
        <!-- Loan items will be dynamically inserted here -->
      </div>
    </div>
  </div>
  
  <script src="js/script.js"></script>
  <script>
    // Logout functionality - Route namespace modified to /auth[cite: 1]
    document.getElementById('loanLogout').addEventListener('click', async () => {
      try {
        const response = await fetch('/auth/logout', { method: 'POST' });
        if (response.ok) {
          window.location.href = 'index.html';
        } else {
          console.error('Logout failed:', response.statusText);
        }
      } catch (err) {
        console.error(err);
      }
    });
    
    // Handle form submission - Route namespace modified to /customer[cite: 1]
    document.getElementById('loanForm').addEventListener('submit', async function(e) {
      e.preventDefault();
      const formData = new FormData(this);
      const data = {
        loan_type: formData.get('loan_type'),
        amount: parseFloat(formData.get('amount')),
        message: formData.get('message')
      };
      try {
        const response = await fetch('/customer/applyLoan', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(data)
        });
        const result = await response.text();
        document.getElementById('loanFormMessage').innerText = result;
        if(response.ok) {
          loadLoans(); 
        }
      } catch (error) {
        console.error('Error applying for loan:', error);
        document.getElementById('loanFormMessage').innerText = 'Server error. Please try again later.';
      }
    });
    
    // Load past customer loans - Route namespace modified to /customer[cite: 1]
    async function loadLoans() {
      try {
        const response = await fetch('/customer/loans');
        if(response.ok) {
          const loans = await response.json();
          const container = document.getElementById('loansContainer');
          container.innerHTML = ''; 
          loans.forEach(loan => {
            const loanDiv = document.createElement('div');
            loanDiv.classList.add('loan-item');
            if(loan.status === 'APPROVED') {
              loanDiv.classList.add('approved');
            } else {
              loanDiv.classList.add('not-approved');
            }
            loanDiv.innerHTML = `
              <div class="loan-overview">
                <span class="loan-id">${loan.loan_id}</span>
                <span class="loan-type">${loan.loan_type}</span>
                <span class="loan-amount">₹${new Intl.NumberFormat('en-IN').format(loan.amount)}</span>
                <span class="loan-status">${loan.status}</span>
                <span class="loan-applied">Applied: ${new Date(loan.applied_timestamp).toLocaleString('en-GB')}</span>
                ${loan.status === 'APPROVED' && loan.approval_timestamp ? `<span class="loan-approved">Approved: ${new Date(loan.approval_timestamp).toLocaleString('en-GB')}</span>` : ''}
                ${loan.status === 'APPROVED' && loan.approver ? `<span class="loan-approver">Approved by: ${loan.approver}</span>` : ''}
                <button class="toggleDetails">Details</button>
              </div>
              <div class="loan-details" style="display: none;">
                <p>${loan.message}</p>
              </div>
            `;
            loanDiv.querySelector('.toggleDetails').addEventListener('click', function() {
              const details = loanDiv.querySelector('.loan-details');
              details.style.display = details.style.display === 'none' ? 'block' : 'none';
            });
            container.appendChild(loanDiv);
          });
        } else {
          console.error('Error fetching loans:', response.statusText);
        }
      } catch (error) {
        console.error('Error fetching loans:', error);
      }
    }
    
    document.addEventListener('DOMContentLoaded', loadLoans);
  </script>
</body>
</html>
