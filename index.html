<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bank of Vellorian - Home</title>
    <link rel="stylesheet" href="css/global.css" />
    <link rel="stylesheet" href="css/index.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@400..700&family=Noto+Sans+Math&family=Oswald:wght@200..700&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Sixtyfour+Convergence&display=swap"
      rel="stylesheet"
    />
    <style>
      /* Reserved space container for spinners */
      .spinner-wrapper {
        position: relative;
        height: 20px;
        margin: 10px auto;
      }

      .spinner {
        visibility: hidden;
        position: absolute;
        left: 50%;
        top: 0;
        transform: translateX(-50%);
        width: 20px;
        height: 20px;
        border: 3px solid #ccc;
        border-top: 3px solid #0056b3;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
      }

      @keyframes spin {
        0% {
          transform: translateX(-50%) rotate(0deg);
        }
        100% {
          transform: translateX(-50%) rotate(360deg);
        }
      }
    </style>
  </head>
  <body>
    <!-- Navbar -->
    <div class="navbar">
      <div class="left">
        <a href="index.html"
          ><img src="images/bankLogo.jpg" alt="Bank Logo"
        /></a>
        <h1><a href="index.html">BANK OF VELLORIAN</a></h1>
      </div>
      <div class="right">
        <!-- Separate login header button interfaces -->
        <button id="nav-employeeLogin">Employee Portal</button>
        <button id="nav-adminLogin">Admin Portal</button>
      </div>
    </div>

    <!-- Main Content -->
    <div class="main-content">
      <!-- Left Panel: Customer Login, Signup, Tips -->
      <div class="left-panel">
        <!-- Login Box Container -->
        <div class="login-box" id="loginContainer">
          <h2 id="loginBoxTitle">Customer Login</h2>

          <!-- Shared Single-Slot Spinner Area -->
          <div class="spinner-wrapper">
            <div id="authSpinner" class="spinner"></div>
          </div>

          <form id="loginForm" onsubmit="return false;">
            <!-- Stage 1 Input: Username -->
            <div id="usernameStep">
              <input
                type="text"
                id="loginUsername"
                placeholder="Username"
                required
              />
              <div
                id="usernameStatus"
                style="
                  font-size: 0.85em;
                  margin-top: 5px;
                  text-align: left;
                  display: none;
                "
              ></div>
              <button type="button" id="nextStepBtn" style="margin-top: 15px">
                Next
              </button>
            </div>

            <!-- Stage 2 Input: Password -->
            <div id="passwordStep" style="display: none; margin-top: 15px">
              <input
                type="password"
                id="loginPassword"
                placeholder="Password"
              />
              <button type="button" id="loginBtn" style="margin-top: 15px">
                Login
              </button>
            </div>

            <!-- Stage 3 Input: 2FA Token Code -->
            <div id="2faStep" style="display: none; margin-top: 15px">
              <p style="font-size: 0.9em; margin-bottom: 8px; color: #555">
                Enter the 6-digit code from your Google Authenticator app:
              </p>
              <input
                type="text"
                id="login2faToken"
                placeholder="6-Digit Code"
                maxlength="6"
                inputmode="numeric"
                autocomplete="one-time-code"
              />
              <button type="button" id="verify2faBtn" style="margin-top: 15px">
                Verify & Login
              </button>
            </div>
          </form>
          <div id="loginError" style="color: red; margin-top: 10px"></div>
          <button
            class="signup-btn"
            id="showSignupBtn"
            style="margin-top: 15px"
          >
            NEW USER? SIGN UP NOW!
          </button>
        </div>

        <!-- Registration Box Container -->
        <div class="login-box" id="signupContainer" style="display: none">
          <h2>Register</h2>
          <form id="signupForm" action="#" method="post">
            <input
              type="text"
              id="regUsername"
              name="username"
              placeholder="Choose Username"
              required
            />
            <input
              type="password"
              id="regPassword"
              name="password"
              placeholder="Create Password"
              required
            />
            <input
              type="password"
              id="regConfirmPassword"
              name="confirmPassword"
              placeholder="Confirm Password"
              required
            />
            <button type="submit" style="margin-top: 20px">
              Register Account
            </button>
          </form>
          <div id="signupError" style="color: red; margin-top: 10px"></div>
          <div id="signupSuccess" style="color: green; margin-top: 10px"></div>
          <button class="signup-btn" id="showLoginBtn" style="margin-top: 15px">
            ALREADY A USER? LOGIN NOW!
          </button>
        </div>

        <div class="tips-box">
          <p>Banking Tip: Never share your OTP with anyone.</p>
        </div>
      </div>

      <!-- Right Panel: Promotional Video -->
      <div class="right-panel video-panel">
        <video controls autoplay muted>
          <source src="promo.mp4" type="video/mp4" />
          Your browser does not support the video tag.
        </video>
      </div>
    </div>

    <script src="js/script.js"></script>
    <script>
      // ==========================================
      // 1. DYNAMIC SYSTEM ROLE CONTEXT STATE MANAGER
      // ==========================================
      let activeRole = "customer";
      let confirmedUsername = "";

      const loginContainer = document.getElementById("loginContainer");
      const signupContainer = document.getElementById("signupContainer");
      const loginBoxTitle = document.getElementById("loginBoxTitle");
      const showSignupBtn = document.getElementById("showSignupBtn");
      const authSpinner = document.getElementById("authSpinner");
      const usernameStatus = document.getElementById("usernameStatus");

      function showSpinner() {
        authSpinner.style.visibility = "visible";
      }

      function hideSpinner() {
        authSpinner.style.visibility = "hidden";
      }

      function resetLoginFormUI(roleName, displayTitle) {
        activeRole = roleName;
        confirmedUsername = "";
        loginBoxTitle.innerText = displayTitle;

        showSignupBtn.style.display =
          roleName === "customer" ? "block" : "none";
        signupContainer.style.display = "none";
        loginContainer.style.display = "block";

        document.getElementById("loginUsername").value = "";
        document.getElementById("loginPassword").value = "";
        document.getElementById("login2faToken").value = "";
        document.getElementById("loginUsername").disabled = false;

        usernameStatus.style.display = "none";
        usernameStatus.innerText = "";

        hideSpinner();

        document.getElementById("usernameStep").style.display = "block";
        document.getElementById("nextStepBtn").style.display = "block";
        document.getElementById("passwordStep").style.display = "none";
        document.getElementById("2faStep").style.display = "none";
        document.getElementById("loginError").innerText = "";
      }

      document
        .getElementById("nav-employeeLogin")
        .addEventListener("click", () => {
          resetLoginFormUI("employee", "Employee Login");
        });

      document
        .getElementById("nav-adminLogin")
        .addEventListener("click", () => {
          resetLoginFormUI("admin", "Admin Control Login");
        });

      document.getElementById("showSignupBtn").addEventListener("click", () => {
        loginContainer.style.display = "none";
        signupContainer.style.display = "block";
        document.getElementById("signupError").innerText = "";
        document.getElementById("signupSuccess").innerText = "";
      });

      document.getElementById("showLoginBtn").addEventListener("click", () => {
        resetLoginFormUI("customer", "Customer Login");
      });

      // Unified Enter Key Listener Across Inputs
      document.getElementById("loginForm").addEventListener("keydown", (e) => {
        if (e.key === "Enter") {
          e.preventDefault();
          const passwordStepVisible =
            document.getElementById("passwordStep").style.display !== "none";
          const twoFactorStepVisible =
            document.getElementById("2faStep").style.display !== "none";

          if (twoFactorStepVisible) {
            handle2faCheck();
          } else if (passwordStepVisible) {
            handlePasswordCheck();
          } else {
            handleUsernameCheck();
          }
        }
      });

      // ==========================================
      // 2. STEP-BY-STEP PROGRESSIVE HANDLERS
      // ==========================================
      async function handleUsernameCheck() {
        const usernameInput = document
          .getElementById("loginUsername")
          .value.trim();
        const errorDiv = document.getElementById("loginError");
        const nextBtn = document.getElementById("nextStepBtn");

        errorDiv.innerText = "";
        usernameStatus.style.display = "none";

        if (!usernameInput) {
          errorDiv.innerText = "Please enter a username.";
          return;
        }

        showSpinner();
        nextBtn.disabled = true;

        try {
          const response = await fetch("/auth/login/check-user", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              username: usernameInput,
              role: activeRole,
            }),
          });

          if (response.ok) {
            confirmedUsername = usernameInput;
            document.getElementById("loginUsername").disabled = true;
            nextBtn.style.display = "none";

            // Display Green "Username exists" message
            usernameStatus.style.color = "green";
            usernameStatus.innerText = "Username exists";
            usernameStatus.style.display = "block";

            document.getElementById("passwordStep").style.display = "block";
            document.getElementById("loginPassword").focus();
          } else {
            const errText = await response.text();
            // Display Red status message under input box
            usernameStatus.style.color = "red";
            usernameStatus.innerText = errText;
            usernameStatus.style.display = "block";
          }
        } catch (err) {
          errorDiv.innerText = "Network execution checking context failure.";
        } finally {
          hideSpinner();
          nextBtn.disabled = false;
        }
      }

      async function handlePasswordCheck() {
        const password = document.getElementById("loginPassword").value;
        const errorDiv = document.getElementById("loginError");
        const loginBtn = document.getElementById("loginBtn");

        errorDiv.innerText = "";

        if (!password) {
          errorDiv.innerText = "Please enter your password.";
          return;
        }

        showSpinner();
        loginBtn.disabled = true;

        try {
          const response = await fetch("/auth/login/verify-password", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              username: confirmedUsername,
              password,
              role: activeRole,
            }),
          });

          const responseText = await response.text();

          if (response.ok) {
            const data = JSON.parse(responseText);
            errorDiv.innerText = "";
            if (data.step === "completed") {
              if (data.userType === "customer")
                window.location.href = "account.html";
              else if (data.userType === "employee")
                window.location.href = "employee.html";
              else if (data.userType === "admin")
                window.location.href = "admin.html";
            } else if (data.step === "2fa_required") {
              document.getElementById("passwordStep").style.display = "none";
              document.getElementById("2faStep").style.display = "block";
              document.getElementById("login2faToken").focus();
            }
          } else {
            errorDiv.innerText = responseText;
          }
        } catch (error) {
          console.error("Error validation:", error);
          errorDiv.innerText = "Server parsing processing validation error.";
        } finally {
          hideSpinner();
          loginBtn.disabled = false;
        }
      }

      async function handle2faCheck() {
        const token = document.getElementById("login2faToken").value.trim();
        const errorDiv = document.getElementById("loginError");
        const verifyBtn = document.getElementById("verify2faBtn");

        errorDiv.innerText = "";

        if (!token || token.length !== 6) {
          errorDiv.innerText =
            "Please enter a valid 6-digit authentication token.";
          return;
        }

        showSpinner();
        verifyBtn.disabled = true;

        try {
          const response = await fetch("/auth/login/verify-2fa", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              username: confirmedUsername,
              token,
              role: activeRole,
            }),
          });

          const responseText = await response.text();

          if (response.ok) {
            const data = JSON.parse(responseText);
            errorDiv.innerText = "";
            if (data.status === "success") {
              if (data.userType === "customer")
                window.location.href = "account.html";
              else if (data.userType === "employee")
                window.location.href = "employee.html";
              else if (data.userType === "admin")
                window.location.href = "admin.html";
            }
          } else {
            // Rejects invalid 2FA attempts cleanly
            errorDiv.innerText = responseText;
          }
        } catch (error) {
          console.error("2FA script processing error:", error);
          errorDiv.innerText = "Network confirmation verification failure.";
        } finally {
          hideSpinner();
          verifyBtn.disabled = false;
        }
      }

      // Attach Explicit Click Handlers
      document
        .getElementById("nextStepBtn")
        .addEventListener("click", handleUsernameCheck);
      document
        .getElementById("loginBtn")
        .addEventListener("click", handlePasswordCheck);
      document
        .getElementById("verify2faBtn")
        .addEventListener("click", handle2faCheck);

      // ==========================================
      // 3. REGISTRATION HANDLER
      // ==========================================
      document
        .getElementById("signupForm")
        .addEventListener("submit", async function (e) {
          e.preventDefault();
          const username = document.getElementById("regUsername").value.trim();
          const password = document.getElementById("regPassword").value;
          const confirmPassword =
            document.getElementById("regConfirmPassword").value;
          const errorDiv = document.getElementById("signupError");
          const successDiv = document.getElementById("signupSuccess");

          errorDiv.innerText = "";
          successDiv.innerText = "";

          if (password !== confirmPassword) {
            errorDiv.innerText = "Passwords do not match.";
            return;
          }

          try {
            const response = await fetch("/auth/register", {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ username, password }),
            });

            const result = await response.text();

            if (response.ok) {
              successDiv.innerText =
                "Registration successful! You can now log in.";
              this.reset();
            } else {
              errorDiv.innerText = result;
            }
          } catch (error) {
            console.error("Error during registration:", error);
            errorDiv.innerText = "Server error. Please try again later.";
          }
        });
    </script>
  </body>
</html>
